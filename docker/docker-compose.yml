services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cryptosentinel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "kafka-ready -b localhost:9092 1 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cryptosentinel-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cryptosentinel-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9093:9093"
    networks:
      - cryptosentinel-net

  postgres:
    image: postgres:16-alpine
    container_name: cryptosentinel-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev_password
      POSTGRES_DB: cryptosentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d cryptosentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptosentinel-net

  redis:
    image: redis:7-alpine
    container_name: cryptosentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptosentinel-net

  vault:
    image: hashicorp/vault:1.15
    container_name: cryptosentinel-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: cryptosentinel-dev-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    command: server -dev
    networks:
      - cryptosentinel-net

  prometheus:
    image: prom/prometheus:latest
    container_name: cryptosentinel-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    networks:
      - cryptosentinel-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: cryptosentinel-alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9094:9093"
    networks:
      - cryptosentinel-net

  grafana:
    image: grafana/grafana:latest
    container_name: cryptosentinel-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cryptosentinel-net


  traefik:
    image: traefik:v3.1
    container_name: cryptosentinel-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cryptosentinel-net


  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: cryptosentinel-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver (matches OTel exporter)
      - "4318:4318"     # OTLP HTTP receiver
    networks:
      - cryptosentinel-net


  loki:
    image: grafana/loki:3.1.1
    container_name: cryptosentinel-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - cryptosentinel-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: cryptosentinel-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ../logs:/var/log/cryptosentinel:ro
    depends_on:
      - loki
    networks:
      - cryptosentinel-net

volumes:
  postgres_data:
  grafana_data:

networks:
  cryptosentinel-net:
    driver: bridge
