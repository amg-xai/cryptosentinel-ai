apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptosentinel-config
  namespace: cryptosentinel
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  DATABASE_URL: "postgresql://sentinel:$(DB_PASSWORD)@postgres-service:5432/cryptosentinel"
  REDIS_URL: "redis://redis-service:6379/0"
  MODEL_ARTIFACTS_PATH: "/app/data/models"
  JWT_ALGORITHM: "RS256"
